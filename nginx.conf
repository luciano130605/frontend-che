server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PWA: el service worker y el manifest nunca se cachean, si no las actualizaciones no llegan.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los assets del build llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: las rutas (/app, /profile, ...) las resuelve el router del front.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
